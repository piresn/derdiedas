<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/favicon.ico">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>DerDieDas</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    document.documentElement.dataset.theme =
      window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  </script>
</head>
<body>
  <header class="page-header">
    <h1>DerDieDas</h1>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Dunkles Design aktivieren" aria-pressed="false">☾</button>
  </header>

  <label>
    Niveau:
    <select id="levelFilter">
      <option value="all">Alle</option>
    </select>
  </label>

  <a class="card" id="card">Wird geladen …</a>
  <p class="small" id="info"></p>
  <button id="mainBtn" disabled>Starten</button>
  <section id="sentences" aria-labelledby="sentencesHeading" aria-live="polite" hidden>
    <h2 id="sentencesHeading">Beispielsätze</h2>
    <p class="small" id="sentenceStatus">Zeige den Artikel an, um Beispielsätze zu sehen.</p>
    <ul id="sentenceList"></ul>
  </section>

  <dialog id="dwdsDialog" aria-label="DWDS-Wörterbucheintrag">
    <div class="dwds-dialog-header">
      <button id="closeDwdsDialog" class="dwds-dialog-close" type="button" aria-label="Schließen">×</button>
    </div>
    <iframe id="dwdsFrame" title="DWDS-Wörterbucheintrag"></iframe>
    <p class="dwds-dialog-fallback">
      Falls der Eintrag hier nicht angezeigt wird,
      <a id="dwdsExternalLink" target="_blank" rel="noopener noreferrer">direkt bei DWDS öffnen</a>.
    </p>
  </dialog>

  <script src="app.js" defer></script>
</body>
</html>
