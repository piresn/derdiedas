<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/favicon.ico">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>DerDieDas</title>
  <style>
    :root {
      color-scheme: light;
      --page-bg: #f6f7f8;
      --text: #202a35;
      --muted: #596575;
      --card-bg: #fff;
      --card-border: #e5e8eb;
      --control-border: #dce1e6;
      --button-bg: #25384b;
      --button-hover: #172838;
      --sentences-muted: #89939e;
      --sentences-heading: #7d8995;
      --small-muted: #77818d;
      --card-shadow: 0 8px 24px rgb(31 45 61 / 4%);
      font-family: "Avenir Next", Avenir, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--page-bg);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --page-bg: #171b20;
      --text: #e6eaf0;
      --muted: #b0bac7;
      --card-bg: #222830;
      --card-border: #343d48;
      --control-border: #414b58;
      --button-bg: #3c536b;
      --button-hover: #4b6682;
      --sentences-muted: #a1acb9;
      --sentences-heading: #b2bdc9;
      --small-muted: #aab4c0;
      --card-shadow: 0 8px 24px rgb(0 0 0 / 18%);
    }

    * {
      box-sizing: border-box;
    }

    body {
      max-width: 600px;
      margin: 0 auto;
      padding: 64px 24px;
    }

    h1 {
      margin: 0 0 32px;
      font-size: clamp(1.6rem, 5vw, 2rem);
      font-weight: 650;
      letter-spacing: -0.045em;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    label {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 550;
    }

    .card {
      min-height: 160px;
      margin: 24px 0 18px;
      padding: 28px;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      background: var(--card-bg);
      box-shadow: var(--card-shadow);
      text-align: center;
      font-size: clamp(1.6rem, 6vw, 2rem);
      font-weight: 450;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .word-display {
      position: relative;
      max-width: 100%;
    }

    .word-gender {
      position: absolute;
      right: 100%;
      width: 2em;
      margin-right: 0.3em;
      text-align: right;
    }

    button, select {
      min-height: 42px;
      border: 1px solid var(--control-border);
      border-radius: 9px;
      background: var(--card-bg);
      color: var(--text);
      font-size: 1rem;
      font: inherit;
      transition: border-color 150ms ease, background-color 150ms ease, transform 150ms ease;
    }

    select {
      padding: 8px 34px 8px 12px;
      cursor: pointer;
    }

    button {
      padding: 10px 17px;
      border-color: var(--button-bg);
      background: var(--button-bg);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .theme-toggle {
      width: 42px;
      height: 42px;
      padding: 0;
      margin-bottom: 32px;
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: 1.35rem;
      line-height: 1;
    }

    #mainBtn {
      display: block;
      margin: 22px auto 0;
      padding: 15px 26px;
      font-size: 1.1rem;
      width: 190px;
    }

    #sentences {
      margin-top: 24px;
      color: var(--sentences-muted);
      font-size: 0.9rem;
    }

    #sentences h2 {
      margin: 0 0 8px;
      color: var(--sentences-heading);
      font-size: 0.95rem;
      font-weight: 550;
    }

    #sentenceList {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .sentence-item {
      line-height: 1.55;
    }

    .sentence-word {
      color: var(--muted);
    }

    button:not(:disabled):hover {
      border-color: var(--button-hover);
      background: var(--button-hover);
      transform: translateY(-1px);
    }

    .theme-toggle:not(:disabled):hover {
      border-color: transparent;
      background: transparent;
      transform: none;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    button:focus-visible, select:focus-visible {
      outline: 3px solid #8db9e8;
      outline-offset: 3px;
    }

    .small {
      margin-top: 18px;
      color: var(--small-muted);
      font-size: 0.875rem;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      body {
        padding: 40px 20px;
      }

      h1 {
        margin-bottom: 26px;
      }

      .card {
        min-height: 140px;
      }
    }
  </style>
  <script>
    document.documentElement.dataset.theme =
      window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  </script>
</head>
<body>
  <header class="page-header">
    <h1>DerDieDas</h1>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Dunkles Design aktivieren" aria-pressed="false">☾</button>
  </header>

  <label>
    Niveau:
    <select id="levelFilter">
      <option value="all">Alle</option>
    </select>
  </label>

  <div class="card" id="card">Wird geladen …</div>
  <p class="small" id="info"></p>
  <button id="mainBtn" disabled>Starten</button>
  <section id="sentences" aria-labelledby="sentencesHeading" aria-live="polite" hidden>
    <h2 id="sentencesHeading">Beispielsätze</h2>
    <p class="small" id="sentenceStatus">Zeige den Artikel an, um Beispielsätze zu sehen.</p>
    <ul id="sentenceList"></ul>
  </section>

  <script>
    const SENTENCE_API_URL = "https://green-fire-c072.orange-king-f185.workers.dev/sentences";

    let words = [];
    let currentWord = null;
    let showingGender = false;
    let sentenceRequestId = 0;

    const card = document.getElementById("card");
    const info = document.getElementById("info");
    const mainBtn = document.getElementById("mainBtn");
    const themeToggle = document.getElementById("themeToggle");
    const colorScheme = window.matchMedia("(prefers-color-scheme: dark)");
    const levelFilter = document.getElementById("levelFilter");
    const sentences = document.getElementById("sentences");
    const sentenceStatus = document.getElementById("sentenceStatus");
    const sentenceList = document.getElementById("sentenceList");
    let themeOverridden = false;

    function updateThemeToggle() {
      const isDark = document.documentElement.dataset.theme === "dark";
      //themeToggle.textContent = isDark ? "☀" : "☾";
      themeToggle.textContent = isDark ? "☼" : "☾";
      themeToggle.setAttribute("aria-label", isDark ? "Helles Design aktivieren" : "Dunkles Design aktivieren");
      themeToggle.setAttribute("aria-pressed", String(isDark));
    }

    themeToggle.addEventListener("click", () => {
      themeOverridden = true;
      document.documentElement.dataset.theme =
        document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      updateThemeToggle();
    });
    colorScheme.addEventListener("change", event => {
      if (themeOverridden) return;
      document.documentElement.dataset.theme = event.matches ? "dark" : "light";
      updateThemeToggle();
    });
    updateThemeToggle();

    function parseCSV(csv) {
      const lines = csv.trim().split(/\r?\n/);
      return lines.map(line => {
        const parts = line.split(",").map(p => p.trim());
        return {
          word: parts[0] || "",
          gender: parts[1] || "",
          level: parts[2] || ""
        };
      }).filter(w => w.word).map((word, index, allWords) => ({
        ...word,
        rank: ((index + 1) / allWords.length) * 100
      }));
    }

    function formatWordRank(rank) {
      if (rank < 1) return "<1%";
      if (rank > 90) return ">90%";
      return `${rank.toFixed(0)}%`;
    }

    function getLevelGroup(level) {
      if (level === "A1" || level === "A2") return "A1/A2";
      if (level === "B1" || level === "B2") return "B1/B2";
      if (level === "C1" || level === "C2") return "C1/C2";
      return level;
    }

    function populateLevelFilter() {
      const levels = [...new Set(words.map(w => getLevelGroup(w.level)).filter(Boolean))].sort();
      levelFilter.innerHTML = `<option value="all">Alle</option>`;
      levels.forEach(level => {
        const opt = document.createElement("option");
        opt.value = level;
        opt.textContent = level;
        levelFilter.appendChild(opt);
      });
      levelFilter.value = levels.includes("A1/A2") ? "A1/A2" : "all";
    }

    function getFilteredWords() {
      const level = levelFilter.value;
      return level === "all" ? words : words.filter(w => getLevelGroup(w.level) === level);
    }

    function pickRandomWord() {
      const pool = getFilteredWords();
      if (pool.length === 0) return null;
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function clearSentences(message, hide = true) {
      sentenceRequestId += 1;
      sentenceList.replaceChildren();
      sentenceStatus.textContent = message;
      sentences.hidden = hide;
    }

    function highlightWord(sentence, word) {
      const escapedWord = word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      const pattern = new RegExp(`(?<![\\p{L}\\p{N}_])${escapedWord}(?![\\p{L}\\p{N}_])`, "giu");
      const fragment = document.createDocumentFragment();
      let lastIndex = 0;

      for (const match of sentence.matchAll(pattern)) {
        fragment.appendChild(document.createTextNode(sentence.slice(lastIndex, match.index)));
        const emphasis = document.createElement("span");
        emphasis.className = "sentence-word";
        emphasis.textContent = match[0];
        fragment.appendChild(emphasis);
        lastIndex = match.index + match[0].length;
      }
      fragment.appendChild(document.createTextNode(sentence.slice(lastIndex)));
      return fragment;
    }

    async function loadSentences(word) {
      const requestId = ++sentenceRequestId;
      sentenceStatus.textContent = "Beispielsätze werden geladen …";
      if (!SENTENCE_API_URL) {
        sentenceStatus.textContent = "Die Beispielsätze sind derzeit nicht verfügbar.";
        return;
      }

      const url = new URL(SENTENCE_API_URL);
      url.searchParams.set("word", word);

      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`Sentence request failed (${response.status}).`);
        }
        const data = await response.json();
        if (sentenceRequestId !== requestId) return;

        const results = Array.isArray(data.sentences) ? data.sentences : [];
        if (results.length === 0) {
          sentenceStatus.textContent = "Keine Beispielsätze gefunden.";
          return;
        }

        sentenceStatus.textContent = "";
        results.forEach(result => {
          const item = document.createElement("li");
          item.className = "sentence-item";
          item.appendChild(highlightWord(result.sentence, word));
          sentenceList.appendChild(item);
        });
      } catch (err) {
        if (sentenceRequestId !== requestId) return;
        console.error("Beispielsätze konnten nicht geladen werden.", err);
        sentenceStatus.textContent = "Beispielsätze konnten nicht geladen werden.";
      }
    }

    function showNewWord() {
      currentWord = pickRandomWord();
      showingGender = false;

      if (!currentWord) {
        card.textContent = "Keine Wörter entsprechen diesem Filter.";
        info.textContent = "";
        mainBtn.textContent = "Weiter";
        clearSentences("Zeige den Artikel an, um Beispielsätze zu sehen.");
        return;
      }

      const gender = document.createElement("span");
      gender.className = "word-gender";
      const wordDisplay = document.createElement("span");
      wordDisplay.className = "word-display";
      const noun = document.createElement("span");
      noun.textContent = currentWord.word.charAt(0).toLocaleUpperCase("de-DE") + currentWord.word.slice(1);
      wordDisplay.append(gender, noun);
      card.replaceChildren(wordDisplay);
      info.textContent = `Niveau: ${currentWord.level} | Wort-Rang: ${formatWordRank(currentWord.rank)}`;
      mainBtn.textContent = "Artikel anzeigen";
      clearSentences("Zeige den Artikel an, um Beispielsätze zu sehen.");
      loadSentences(currentWord.word.charAt(0).toLocaleUpperCase("de-DE") + currentWord.word.slice(1));
    }

    function revealGender() {
      card.querySelector(".word-gender").textContent = currentWord.gender;
      mainBtn.textContent = "Nächstes Wort";
      showingGender = true;
      sentences.hidden = false;
    }

    fetch("nouns_small.csv")
      .then(res => res.text())
      .then(text => {
        words = parseCSV(text);
        populateLevelFilter();
        card.textContent = `${words.length} Wörter geladen. Klicke auf „Starten“.`;
        mainBtn.disabled = false;
      })
      .catch(err => {
        console.error("Die Wortliste konnte nicht geladen werden.", err);
        card.textContent = "Die Wortliste konnte nicht geladen werden.";
        info.textContent = "";
      });

    mainBtn.addEventListener("click", () => {
      if (!currentWord || showingGender) {
        showNewWord();
      } else {
        revealGender();
      }
    });

    levelFilter.addEventListener("change", () => {
      currentWord = null;
      showingGender = false;
      if (words.length) {
        card.textContent = "Filter geändert. Klicke auf „Starten“.";
        info.textContent = "";
        mainBtn.textContent = "Starten";
        clearSentences("Zeige den Artikel an, um Beispielsätze zu sehen.");
      }
    });
  </script>
</body>
</html>
