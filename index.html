<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DerDieDas</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #202a35;
      background: #f6f7f8;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * {
      box-sizing: border-box;
    }

    body {
      max-width: 600px;
      margin: 0 auto;
      padding: 64px 24px;
    }

    h1 {
      margin: 0 0 32px;
      font-size: clamp(1.6rem, 5vw, 2rem);
      font-weight: 650;
      letter-spacing: -0.045em;
    }

    label {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: #596575;
      font-size: 0.9rem;
      font-weight: 550;
    }

    .card {
      min-height: 160px;
      margin: 24px 0 18px;
      padding: 28px;
      border: 1px solid #e5e8eb;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 8px 24px rgb(31 45 61 / 4%);
      text-align: center;
      font-size: clamp(1.6rem, 6vw, 2rem);
      font-weight: 450;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .word-display {
      position: relative;
      max-width: 100%;
    }

    .word-gender {
      position: absolute;
      right: 100%;
      width: 2em;
      margin-right: 0.3em;
      text-align: right;
    }

    button, select {
      min-height: 42px;
      border: 1px solid #dce1e6;
      border-radius: 9px;
      background: #fff;
      color: #202a35;
      font-size: 1rem;
      font: inherit;
      transition: border-color 150ms ease, background-color 150ms ease, transform 150ms ease;
    }

    select {
      padding: 8px 34px 8px 12px;
      cursor: pointer;
    }

    button {
      padding: 10px 17px;
      border-color: #25384b;
      background: #25384b;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    #mainBtn {
      display: block;
      margin: 12px auto 0;
      padding: 15px 26px;
      font-size: 1.1rem;
    }

    button:not(:disabled):hover {
      border-color: #172838;
      background: #172838;
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    button:focus-visible, select:focus-visible {
      outline: 3px solid #8db9e8;
      outline-offset: 3px;
    }

    .small {
      margin-top: 18px;
      color: #77818d;
      font-size: 0.875rem;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      body {
        padding: 40px 20px;
      }

      h1 {
        margin-bottom: 26px;
      }

      .card {
        min-height: 140px;
      }
    }
  </style>
</head>
<body>
  <h1>DerDieDas</h1>

  <label>
    Level:
    <select id="levelFilter">
      <option value="all">All</option>
    </select>
  </label>

  <div class="card" id="card">Loading...</div>
  <button id="mainBtn" disabled>Start</button>
  <p class="small" id="info"></p>

  <script>
    let words = [];
    let currentWord = null;
    let showingGender = false;

    const card = document.getElementById("card");
    const info = document.getElementById("info");
    const mainBtn = document.getElementById("mainBtn");
    const levelFilter = document.getElementById("levelFilter");

    function parseCSV(csv) {
      const lines = csv.trim().split(/\r?\n/);
      return lines.slice(1).map(line => {
        const parts = line.split(",").map(p => p.trim());
        return {
          word: parts[0] || "",
          gender: parts[1] || "",
          frequency: Number(parts[2]) || 0,
          level: parts[3] || ""
        };
      }).filter(w => w.word);
    }

    function populateLevelFilter() {
      const levels = [...new Set(words.map(w => w.level).filter(Boolean))].sort();
      levelFilter.innerHTML = `<option value="all">All</option>`;
      levels.forEach(level => {
        const opt = document.createElement("option");
        opt.value = level;
        opt.textContent = level;
        levelFilter.appendChild(opt);
      });
    }

    function getFilteredWords() {
      const level = levelFilter.value;
      return level === "all" ? words : words.filter(w => w.level === level);
    }

    function pickRandomWord() {
      const pool = getFilteredWords();
      if (pool.length === 0) return null;
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function showNewWord() {
      currentWord = pickRandomWord();
      showingGender = false;

      if (!currentWord) {
        card.textContent = "No words match filter";
        info.textContent = "";
        mainBtn.textContent = "Next";
        return;
      }

      const gender = document.createElement("span");
      gender.className = "word-gender";
      const wordDisplay = document.createElement("span");
      wordDisplay.className = "word-display";
      const noun = document.createElement("span");
      noun.textContent = currentWord.word;
      wordDisplay.append(gender, noun);
      card.replaceChildren(wordDisplay);
      info.textContent = `Level: ${currentWord.level} | Frequency: ${currentWord.frequency}`;
      mainBtn.textContent = "Reveal gender";
    }

    function revealGender() {
      card.querySelector(".word-gender").textContent = currentWord.gender;
      mainBtn.textContent = "Next word";
      showingGender = true;
    }

    fetch("nouns_small.csv")
      .then(res => res.text())
      .then(text => {
        words = parseCSV(text);
        populateLevelFilter();
        card.textContent = `Loaded ${words.length} words. Click Start.`;
        mainBtn.disabled = false;
      })
      .catch(err => {
        card.textContent = "Could not load nouns_small.csv";
        info.textContent = err.message;
      });

    mainBtn.addEventListener("click", () => {
      if (!currentWord || showingGender) {
        showNewWord();
      } else {
        revealGender();
      }
    });

    levelFilter.addEventListener("change", () => {
      currentWord = null;
      showingGender = false;
      if (words.length) {
        card.textContent = "Filter changed. Click Start.";
        info.textContent = "";
        mainBtn.textContent = "Start";
      }
    });
  </script>
</body>
</html>
